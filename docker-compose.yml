services:
  mariadb:
    image: mariadb:12.3
    container_name: muisti-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: muisti-root
      MARIADB_DATABASE: muisti
      MARIADB_USER: muisti
      MARIADB_PASSWORD: muisti
    ports:
      - "3309:3306"
    volumes:
      - muisti-data:/var/lib/mysql
      - ./infra/mariadb/muisti.cnf:/etc/mysql/conf.d/muisti.cnf:ro
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  muisti-data:
